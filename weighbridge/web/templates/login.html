{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="auth-box">
  <div class="brand-block"><span class="brand-mark" aria-hidden="true"></span>
    <div><strong>{{ company.name }}</strong><br><small>{{ company.site_name }} · weighbridge</small></div></div>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="muted small">Your own username only. Every action is recorded against it.</p>
</div>
{% endblock %}
